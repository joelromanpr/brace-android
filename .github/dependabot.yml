version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      kotlin-compose:
        patterns: ["org.jetbrains.kotlin*", "androidx.compose*"]
      android-toolchain:
        patterns: ["com.android.tools.build:gradle", "com.android.application", "com.android.library"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
