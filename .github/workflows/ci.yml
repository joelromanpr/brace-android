name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build, lint, tests, tokens, inventory, and public API
        run: ./gradlew build lint checkTokenGeneration checkBlueprintIconGeneration checkBlueprintNextIconGeneration checkInventory apiCheck --stacktrace
      - name: Build documentation site
        run: node scripts/build-docs.mjs
      - name: Check documentation JavaScript syntax
        run: node --check docs/site/app.js
  instrumented:
    name: instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK platform
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Free unused hosted tools for the Android emulator
        run: |
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Compile instrumentation APKs before launching the emulator
        run: |
          ./gradlew :brace-icons:assembleDebugAndroidTest :brace-blueprint-icons:assembleDebugAndroidTest :brace-blueprint-icons-next:assembleDebugAndroidTest :brace-foundation:assembleDebugAndroidTest :brace-core:assembleDebugAndroidTest :brace-select:assembleDebugAndroidTest :brace-datetime:assembleDebugAndroidTest :brace-table:assembleDebugAndroidTest :catalog:assembleDebugAndroidTest --no-parallel --stacktrace
          ./gradlew --stop
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose interaction and accessibility tests on API 34
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          disk-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One emulator cannot host multiple module instrumentation APKs concurrently.
          script: ./gradlew :brace-icons:connectedDebugAndroidTest :brace-blueprint-icons:connectedDebugAndroidTest :brace-blueprint-icons-next:connectedDebugAndroidTest :brace-foundation:connectedDebugAndroidTest :brace-core:connectedDebugAndroidTest :brace-select:connectedDebugAndroidTest :brace-datetime:connectedDebugAndroidTest :brace-table:connectedDebugAndroidTest :catalog:connectedDebugAndroidTest --no-parallel -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" --stacktrace
