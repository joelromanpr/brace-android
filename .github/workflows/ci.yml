name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, tests, tokens, inventory, and public API
        run: ./gradlew build lint checkTokenGeneration checkInventory apiCheck --stacktrace
      - name: Build documentation site
        run: node scripts/build-docs.mjs
      - name: Check documentation JavaScript syntax
        run: node --check docs/site/app.js
  instrumented:
    name: instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK platform
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
      - name: Free unused hosted tools for the Android emulator
        run: |
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose interaction and accessibility tests on API 34
        uses: reactivecircus/android-emulator-runner@5d6e86df22ab11632167a1a6b0c9ab0dc3469586 # v2.36.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disk-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One emulator cannot host multiple module instrumentation APKs concurrently.
          script: ./gradlew :brace-icons:connectedDebugAndroidTest :brace-foundation:connectedDebugAndroidTest :brace-core:connectedDebugAndroidTest --no-parallel --stacktrace
