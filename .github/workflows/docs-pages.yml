name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'inventory/**'
      - 'scripts/generate_coverage.py'
      - 'scripts/build-docs.mjs'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated inventory pages
        run: python3 scripts/generate_coverage.py --check
      - name: Build site
        run: node scripts/build-docs.mjs
      - uses: actions/configure-pages@v6
        if: ${{ !github.event.repository.private }}
      - uses: actions/upload-pages-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          path: build/site
  deploy:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
